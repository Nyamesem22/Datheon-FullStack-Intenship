name: CI • Weather Dashboard
on:
  push:
    branches: [main, staging]
    paths:
      - 'projects/03-weather-dashboard/**'
      - '.github/workflows/weather.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'projects/03-weather-dashboard/**'
      - '.github/workflows/weather.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-weather-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/03-weather-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
